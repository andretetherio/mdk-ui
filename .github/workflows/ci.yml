name: CI Checks

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "lts/*"
  PNPM_VERSION: "10.5.0"

jobs:
  security_checks:
    name: 🔐 Security Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          vulnerability-check: true
          license-check: true

      - name: Restore dependencies
        uses: ./.github/actions/pnpm-restore-cache
        with:
          cache-key: ${{ needs.setup.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Security audit
        run: |
          set +e
          pnpm audit --audit-level=moderate 2>&1
          MODERATE_EXIT=$?
          pnpm audit --audit-level=high 2>&1
          HIGH_EXIT=$?
          set -e

          [ $MODERATE_EXIT -eq 0 ] && MODERATE_STATUS="PASS" || MODERATE_STATUS="WARN"
          [ $HIGH_EXIT -eq 0 ] && HIGH_STATUS="PASS" || HIGH_STATUS="FAIL"

          {
            echo "## Security Audit Summary"
            echo ""
            echo "| Scope | Moderate Audit | High Audit | Gate |"
            echo "|---|---|---|---|"
            echo "| Repo | ${MODERATE_STATUS} | ${HIGH_STATUS} | High/Critical blocking |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $MODERATE_EXIT -ne 0 ]; then
            echo "::error::pnpm audit reported moderate-level issues"
          fi
          if [ $HIGH_EXIT -ne 0 ]; then
            echo "::error::pnpm audit reported high-level issues"
          fi

          [ $HIGH_EXIT -eq 0 ]

  setup:
    name: 📦 Setup Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cache-key: ${{ steps.setup-deps.outputs.cache-key }}
      lockfile-outcome: ${{ steps.lockfile.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup runtime
        uses: ./.github/actions/setup-runtime
        with:
          node_version: ${{ env.NODE_VERSION }}
          package_manager: pnpm
          pnpm_version: ${{ env.PNPM_VERSION }}
          cache_dependency_path: pnpm-lock.yaml

      - name: Lockfile consistency check
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            echo "No pnpm-lock.yaml; skipping lockfile check"
            exit 0
          fi
          pnpm install --lockfile-only
          git diff --exit-code pnpm-lock.yaml || (
            echo "::error::pnpm-lock.yaml is out of sync with package.json."
            echo "::error::Regenerate with: pnpm install --lockfile-only"
            exit 1
          )

      - name: Install dependencies and cache node_modules
        id: setup-deps
        uses: ./.github/actions/pnpm-setup-cache
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

  lint:
    name: ✨ Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Restore dependencies
        uses: ./.github/actions/pnpm-restore-cache
        with:
          cache-key: ${{ needs.setup.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run linting
        run: pnpm run --if-present lint

  typecheck:
    name: 🔎 Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [setup]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Restore dependencies
        uses: ./.github/actions/pnpm-restore-cache
        with:
          cache-key: ${{ needs.setup.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Typecheck
        run: pnpm run --if-present typecheck

  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [setup]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Restore dependencies
        uses: ./.github/actions/pnpm-restore-cache
        with:
          cache-key: ${{ needs.setup.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Format check
        continue-on-error: true
        run: pnpm run --if-present format

      - name: Test with coverage
        id: run-tests
        run: pnpm run test:coverage || pnpm test

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          TEST_OUTCOME="${{ steps.run-tests.outcome }}"
          mapfile -t COVERAGE_JSON_FILES < <(find . -type f -path '*/coverage/coverage-final.json')
          mapfile -t LCOV_FILES < <(find . -type f -path '*/coverage/lcov.info')

          if [ ${#COVERAGE_JSON_FILES[@]} -gt 0 ]; then
            rm -rf .nyc_output
            mkdir -p .nyc_output
            i=0
            for file in "${COVERAGE_JSON_FILES[@]}"; do
              cp "$file" ".nyc_output/out-$i.json"
              i=$((i + 1))
            done

            npx --yes nyc merge .nyc_output coverage-merged.json >/dev/null
            cp coverage-merged.json .nyc_output/out.json
            NYC_REPORT="$(npx --yes nyc report --reporter=text-summary 2>&1)"
            echo "$NYC_REPORT"
            STMT=$(echo "$NYC_REPORT" | sed -n 's/^Statements[^:]*: *\([0-9.]*\)%.*/\1/p')
            BRANCH=$(echo "$NYC_REPORT" | sed -n 's/^Branches[^:]*: *\([0-9.]*\)%.*/\1/p')
            FN=$(echo "$NYC_REPORT" | sed -n 's/^Functions[^:]*: *\([0-9.]*\)%.*/\1/p')
            LINES=$(echo "$NYC_REPORT" | sed -n 's/^Lines[^:]*: *\([0-9.]*\)%.*/\1/p')
            [ -z "$STMT" ] && STMT="—"; [ -z "$BRANCH" ] && BRANCH="—"; [ -z "$FN" ] && FN="—"; [ -z "$LINES" ] && LINES="—"
            SRC="coverage-final.json"
          elif [ ${#LCOV_FILES[@]} -gt 0 ]; then
            LF=$(awk -F: '/^LF:/ {sum+=$2} END {print sum+0}' "${LCOV_FILES[@]}")
            LH=$(awk -F: '/^LH:/ {sum+=$2} END {print sum+0}' "${LCOV_FILES[@]}")
            FNF=$(awk -F: '/^FNF:/ {sum+=$2} END {print sum+0}' "${LCOV_FILES[@]}")
            FNH=$(awk -F: '/^FNH:/ {sum+=$2} END {print sum+0}' "${LCOV_FILES[@]}")
            BRF=$(awk -F: '/^BRF:/ {sum+=$2} END {print sum+0}' "${LCOV_FILES[@]}")
            BRH=$(awk -F: '/^BRH:/ {sum+=$2} END {print sum+0}' "${LCOV_FILES[@]}")

            LINES=$(awk -v h="$LH" -v f="$LF" 'BEGIN { if (f==0) print "0.00"; else printf "%.2f", (h/f)*100 }')
            STMT="$LINES"
            FN=$(awk -v h="$FNH" -v f="$FNF" 'BEGIN { if (f==0) print "0.00"; else printf "%.2f", (h/f)*100 }')
            BRANCH=$(awk -v h="$BRH" -v f="$BRF" 'BEGIN { if (f==0) print "0.00"; else printf "%.2f", (h/f)*100 }')
            SRC="lcov.info"
          else
            STMT="—"; BRANCH="—"; FN="—"; LINES="—"; SRC="none"
          fi

          [ "$TEST_OUTCOME" = "success" ] && ICON="✅ PASS" || ICON="❌ FAIL"
          {
            echo "## Coverage Summary"
            echo ""
            echo "| Scope | Status | Statements | Branches | Functions | Lines | Source | Gate |"
            echo "|---|---|---:|---:|---:|---:|---|---|"
            echo "| Repo | ${ICON} | ${STMT}% | ${BRANCH}% | ${FN}% | ${LINES}% | ${SRC} | Vitest thresholds |"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$TEST_OUTCOME" = "success" ] || exit 1

  build:
    name: 🏗️ Build & Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup]
    permissions:
      contents: read
    outputs:
      build-ran: ${{ steps.build-gate.outputs.build-ran }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Detect build script
        id: build-gate
        shell: bash
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.build?0:1)"; then
            echo "build-ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "build-ran=false" >> "$GITHUB_OUTPUT"
            echo "No \`build\` script in package.json; skipping build and bundle report."
          fi

      - name: Restore dependencies
        if: steps.build-gate.outputs.build-ran == 'true'
        uses: ./.github/actions/pnpm-restore-cache
        with:
          cache-key: ${{ needs.setup.outputs.cache-key }}
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build and bundle size report
        if: steps.build-gate.outputs.build-ran == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_LOG="${RUNNER_TEMP}/build.log"
          pnpm run build 2>&1 | tee "${BUILD_LOG}"
          {
            echo "## Build report"
            echo ""
            echo '```text'
            sed 's/\x1b\[[0-9;]*m//g' "${BUILD_LOG}" | tail -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.size?0:1)"; then
            {
              echo ""
              echo "## Bundle Size Report"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            set +e
            pnpm run size -- --markdown 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log for summary job
        if: always() && steps.build-gate.outputs.build-ran == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 1
          if-no-files-found: ignore

  summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security_checks, setup, lint, typecheck, test, build]
    if: always() && !cancelled()
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download build log
        if: always() && needs.build.outputs.build-ran == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: ci-build-log

      - name: Write job summary
        env:
          R_SECURITY: ${{ needs.security_checks.result }}
          R_SETUP: ${{ needs.setup.result }}
          R_LINT: ${{ needs.lint.result }}
          R_TYPECHECK: ${{ needs.typecheck.result }}
          R_TEST: ${{ needs.test.result }}
          R_BUILD: ${{ needs.build.result }}
          BUILD_RAN: ${{ needs.build.outputs.build-ran }}
          LOCKFILE_OUTCOME: ${{ needs.setup.outputs.lockfile-outcome }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          ic() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "❔" ;;
            esac
          }
          if [ "${LOCKFILE_OUTCOME}" = "failure" ]; then
            {
              echo "## ❌ Lockfile consistency check failed"
              echo ""
              echo "\`pnpm-lock.yaml\` is out of sync with \`package.json\`. **Install and caching were not run.**"
              echo ""
              echo "**Fix:**"
              echo '```bash'
              echo "pnpm install --lockfile-only"
              echo '```'
              echo ""
              echo "See the **Setup Dependencies** job → **Lockfile consistency check** step for details."
              echo ""
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "## 📊 CI Checks summary"
            echo ""
            echo "### 🏷️ Run"
            echo "- **Event:** ${EVENT}"
            echo "- **Branch:** \`${REF_NAME}\`"
            echo ""
            echo "### 📌 Commit"
            echo "- **SHA:** \`$(git rev-parse HEAD)\`"
            echo "- **Message:** $(git log -1 --pretty=format:'%s')"
            echo "- **Author:** $(git log -1 --pretty=format:'%an <%ae>')"
            echo "- **Date:** $(git log -1 --pretty=format:'%ad' --date=short)"
            echo ""
            if [ "${BUILD_RAN}" = "true" ]; then
              R_BUILD_DISPLAY="${R_BUILD}"
            else
              R_BUILD_DISPLAY="skipped"
            fi
            echo "### 🎯 Job results"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| 📦 Setup | $(ic "${R_SETUP}") \`${R_SETUP}\` |"
            echo "| 🔐 Security checks | $(ic "${R_SECURITY}") \`${R_SECURITY}\` |"
            echo "| ✨ Lint | $(ic "${R_LINT}") \`${R_LINT}\` |"
            echo "| 🔎 Typecheck | $(ic "${R_TYPECHECK}") \`${R_TYPECHECK}\` |"
            echo "| 🧪 Test & coverage | $(ic "${R_TEST}") \`${R_TEST}\` |"
            echo "| 🏗️ Build & bundle | $(ic "${R_BUILD_DISPLAY}") \`${R_BUILD_DISPLAY}\` |"
            echo ""
            if [ "${BUILD_RAN}" = "true" ] && [ -f build.log ]; then
              echo "### 🏗️ Build output"
              echo ""
              echo '```text'
              sed 's/\x1b\[[0-9;]*m//g' build.log | tail -n 80
              echo '```'
              echo ""
            fi
            echo "### ✅ What ran"
            echo "- **One pnpm install per workflow** in setup; downstream jobs restore \`node_modules\` from cache"
            echo "- **PR:** dependency review + \`pnpm audit\` (reuse cached deps)"
            echo "- **All events:** parallel lint, typecheck, test$([ "${BUILD_RAN}" = "true" ] && echo ", build" || echo "")"
            echo "- Vitest coverage summary when reports are produced"
          } | tee -a "$GITHUB_STEP_SUMMARY"

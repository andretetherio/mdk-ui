name: pnpm setup with node_modules cache
description: Run pnpm install once and save node_modules to the Actions cache for downstream jobs.

inputs:
  node-version:
    description: Node.js version
    required: true
  pnpm-version:
    description: pnpm version
    required: true
  install-dependencies:
    description: Run pnpm install before saving cache
    required: false
    default: 'true'
  working-directory:
    description: Directory containing package.json and pnpm-lock.yaml (use . for repo root)
    required: false
    default: '.'

outputs:
  cache-key:
    description: Cache key for pnpm-restore-cache
    value: ${{ steps.cache-keys.outputs.cache-key }}
  cache-hit:
    description: Whether node_modules was restored from cache
    value: ${{ steps.cache-node-modules.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Generate cache keys
      id: cache-keys
      shell: bash
      env:
        PKG_DIR: ${{ inputs.working-directory }}
      run: |
        NODE_VERSION="${{ inputs.node-version }}"
        PNPM_VERSION="${{ inputs.pnpm-version }}"
        WD="${PKG_DIR:-.}"
        if [ "$WD" = "." ]; then
          SLUG="root"
          LOCK="pnpm-lock.yaml"
          PKG="package.json"
          NM="node_modules"
        else
          SLUG="${WD//\//-}"
          LOCK="${WD}/pnpm-lock.yaml"
          PKG="${WD}/package.json"
          NM="${WD}/node_modules"
        fi
        BASE_KEY="pnpm-node-modules-${{ runner.os }}-${NODE_VERSION}-${PNPM_VERSION}-${SLUG}"
        FINGERPRINT=""
        [ -f "$LOCK" ] && FINGERPRINT+=$(sha256sum "$LOCK" | awk '{print $1}')
        [ -f "$PKG" ] && FINGERPRINT+=$(sha256sum "$PKG" | awk '{print $1}')
        [ -z "$FINGERPRINT" ] && FINGERPRINT="no-lock"
        HASH_KEY="${BASE_KEY}-${FINGERPRINT:0:24}"
        echo "cache-key=${HASH_KEY}" >> "$GITHUB_OUTPUT"
        echo "base-key=${BASE_KEY}" >> "$GITHUB_OUTPUT"
        echo "node-modules-path=${NM}" >> "$GITHUB_OUTPUT"
        echo "pnpm-lock-path=${LOCK}" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ steps.cache-keys.outputs.pnpm-lock-path }}

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        PKG_DIR: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        WD="${PKG_DIR:-.}"
        if [ "$WD" != "." ]; then
          cd "$WD"
        fi
        pnpm install --frozen-lockfile

    - name: Save node_modules cache
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: ${{ steps.cache-keys.outputs.node-modules-path }}
        key: ${{ steps.cache-keys.outputs.cache-key }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.base-key }}-

name: Restore pnpm node_modules cache
description: Restore node_modules from cache; pnpm install only on cache miss.

inputs:
  cache-key:
    description: cache-key from pnpm-setup-cache
    required: true
  node-version:
    description: Node.js version
    required: true
  pnpm-version:
    description: pnpm version
    required: true
  working-directory:
    description: Directory containing package.json (use . for repo root)
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Resolve paths
      id: paths
      shell: bash
      env:
        PKG_DIR: ${{ inputs.working-directory }}
      run: |
        WD="${PKG_DIR:-.}"
        if [ "$WD" = "." ]; then
          echo "node-modules-path=node_modules" >> "$GITHUB_OUTPUT"
          echo "pnpm-lock-path=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
        else
          echo "node-modules-path=${WD}/node_modules" >> "$GITHUB_OUTPUT"
          echo "pnpm-lock-path=${WD}/pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore node_modules cache
      id: cache-node-modules
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.paths.outputs.node-modules-path }}
        key: ${{ inputs.cache-key }}
        restore-keys: |
          pnpm-node-modules-${{ runner.os }}-

    - name: Setup pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ steps.paths.outputs.pnpm-lock-path }}

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      env:
        PKG_DIR: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        WD="${PKG_DIR:-.}"
        if [ "$WD" != "." ]; then
          cd "$WD"
        fi
        pnpm install --frozen-lockfile
